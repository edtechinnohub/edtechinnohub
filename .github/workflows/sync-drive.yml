name: Sync Drive content

on:
  schedule:
    - cron: '0 * * * *' # 🤖 This tells the robot to check your Google Drive every hour
  workflow_dispatch: # 🔘 This creates the manual "Run workflow" button for you

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Website Files
        uses: actions/checkout@v4

      - name: Turn on Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Website Tools
        run: npm install

      - name: Fetch Files From Google Drive
        run: node scripts/sync-drive.mjs
        env:
          DRIVE_BOOKS_FOLDER_ID: ${{ secrets.DRIVE_BOOKS_FOLDER_ID }}
          DRIVE_RESOURCES_FOLDER_ID: ${{ secrets.DRIVE_RESOURCES_FOLDER_ID }}

      - name: Save Changes to Website
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic update: Synced content from Google Drive"
          branch: main
